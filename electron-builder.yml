{
  "appId": "com.sainihal.p2pvideochat",
  "productName": "P2P Video Chat",
  "directories": {
    "output": "dist"
  },
  "files": ["src/**/*", "package.json"],
  "win": {
    "target": ["nsis", "portable"]
  },
  "mac": {
    "target": ["dmg"],
    "category": "public.app-category.social-networking"
  },
  "linux": {
    "target": ["AppImage", "deb"],
    "category": "Network"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true
  }
}
